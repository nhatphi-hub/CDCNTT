spring.application.name=smart-ecommerce-backend

# Database connection and credentials are required environment configuration.
# Validation runs before any datasource or application initializer is created.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:0603}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# Server-owned flat shipping amount; clients cannot change an order's delivery fee.
app.order.shipping-fee=${ORDER_SHIPPING_FEE:0.00}

# Set PAYMENT_MOCK_CALLBACK_SECRET to a private value before accepting mock callbacks.
app.payment.mock-callback-secret=${PAYMENT_MOCK_CALLBACK_SECRET:}

# Required Base64-encoded signing key (at least 32 decoded bytes).
app.jwt.secret=${JWT_SECRET:c21hcnRfZWNvbW1lcmNlX2p3dF9zZWNyZXRfa2V5XzIwMjZfY2hhbmdlX3RoaXNfdG9fYV9sb25nX3JhbmRvbV92YWx1ZQ==}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Local frontend defaults. Set CORS_ALLOWED_ORIGINS to the exact frontend origins in each environment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173}

# Google OAuth Web Client ID; public identifier, not a client secret.
app.google.client-id=${GOOGLE_CLIENT_ID:230900237413-4psssq06jtftg2g85lcab9d5smfr9sp4.apps.googleusercontent.com}

# Optional one-time admin bootstrap. Leave both values empty to disable account creation.
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Administrator}

# Product image uploads (persistent writable folder, outside web root)
app.upload.dir=${PPEE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
